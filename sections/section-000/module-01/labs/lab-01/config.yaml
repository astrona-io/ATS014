metadata:
  name: "ats-014-lab-000-01"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-000-01-setup"
      description: "Creates one correctly meshed namespace, one namespace that was never labelled for injection, and one workload that opted out with an annotation"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-every-workload-is-meshed"
      description: "Confirms both namespaces are injected, no workload opts out, every pod carries the istio-proxy native sidecar, and the control plane sees all of them"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
