metadata:
  name: "ats-014-lab-000-01-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-000-02-workloads"
      description: "Creates the starfleet namespace with the Starfleet (bridge, cargo, scout v1-v3, navcom), the shuttle client and mesh-wide access logs"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"
    - name: "lab-000-02-fault"
      description: "Applies the starting state: the cargo Service selects a label no pod carries, so it has no endpoints"
      type: "file"
      source: "bootstrap/03-seed-fault.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-supply-ship"
      description: "Confirms the cargo Service selects the cargo pods again, the shuttle's proxy holds a healthy cargo endpoint, the workloads are unchanged, and live requests to cargo and the bridge page succeed"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
