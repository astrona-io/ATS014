metadata:
  name: "ats-014-capstone-050"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: kind
  kind:
    # Loaded into the node from the host cache: Istio and the workloads start
    # without a registry pull on every run.
    preloadImages:
      - "registry.istio.io/release/pilot:1.30.5"
      - "registry.istio.io/release/proxyv2:1.30.5"
      - "nginx:1.27-alpine"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "capstone-050-setup"
      description: "Creates the orders namespace with a two-hop call chain, booking-service calling notification-service, and no Istio traffic configuration"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-section-050-capstone"
      description: "Confirms an abort scoped to x-chaos: abort sits next to a retry policy on the same rule and produces exactly one FI-flagged attempt, because the fault filter answers before the router can retry, that a second scoped rule uses a delay to make a timeout fire, and that unmarked traffic is completely untouched"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
