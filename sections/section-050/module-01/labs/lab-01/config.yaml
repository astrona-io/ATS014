metadata:
  name: "ats-014-lab-050-01"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: kind
  kind:
    # Loaded into the node from the host cache: Istio and the workloads start
    # without a registry pull on every run.
    preloadImages:
      - "registry.istio.io/release/pilot:1.30.5"
      - "registry.istio.io/release/proxyv2:1.30.5"
      - "nginx:1.27-alpine"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-050-01-setup"
      description: "Creates the fault-demo namespace with a two-hop call chain, booking-service calling notification-service, and no Istio traffic configuration"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-fault-injection"
      description: "Confirms a header-scoped fault affects only requests with end-user: tester, that unmarked requests are untouched, that the fault filter is in the caller's sidecar proxy, and that a 7s delay behind a 3s route timeout makes the timeout fire with UT in the client's access log"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
