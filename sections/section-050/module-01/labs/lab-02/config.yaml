metadata:
  name: "ats-014-lab-050-01-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-050-01-02-workloads"
      description: "Creates the starfleet namespace with the Starfleet (bridge, cargo, scout v1-v3, navcom), the probe v1/v2, the shuttle client and mesh-wide access logs"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"
    - name: "lab-050-01-02-routes"
      description: "Applies the starting state: scout and navcom subsets, and a scout VirtualService that sends end-user: jason to scout v2, which calls navcom. No fault is injected yet"
      type: "file"
      source: "bootstrap/03-seed-fault.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-two-drills"
      description: "Confirms navcom has a 2s delay fault for every request and the probe a 503 abort fault for every request, that jason's requests through scout v2 still succeed about 2s late with DI in scout v2's access log, and that requests to the probe fail at once with FI in the shuttle's access log and never reach the probe"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
