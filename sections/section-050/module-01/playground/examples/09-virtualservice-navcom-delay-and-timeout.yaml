# Mistake on purpose: delay AND timeout on the SAME route.
# Looks like it should time out after 0.5s – but a route with "fault" ignores
# its own timeout (and retries). The request waits the full 2s.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: navcom
  namespace: starfleet
spec:
  hosts:
  - navcom
  http:
  - fault:
      delay:
        percentage:
          value: 100
        fixedDelay: 2s
    route:
    - destination:
        host: navcom
        subset: v1
    timeout: 0.5s
