# Route by request header: user "jason" gets v2, everyone else gets v1.
# Needs the reviews DestinationRule (subsets v1, v2), which the playground installs.
# reviews v2 calls ratings, so jason's requests reach ratings and show its faults.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: reviews
  namespace: bookinfo
spec:
  hosts:
  - reviews
  http:
  # Rules are checked top to bottom; the first match wins.
  # Rule 1: header "end-user" equals "jason" exactly.
  - match:
    - headers:
        end-user:
          # Also possible: prefix: "ja", regex: "^j.*"
          exact: jason
    route:
    - destination:
        host: reviews
        subset: v2
  # Rule 2: catch-all (no match). Must be last, or rule 1 is never reached.
  - route:
    - destination:
        host: reviews
        subset: v1
