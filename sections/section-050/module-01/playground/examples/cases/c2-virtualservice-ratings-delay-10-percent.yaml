# Case 2: a little bit slow – 10% of requests get a 1s delay.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: ratings
  namespace: bookinfo
spec:
  hosts:
  - ratings
  http:
  - fault:
      delay:
        percentage:
          value: 10
        fixedDelay: 1s
    route:
    - destination:
        host: ratings
        subset: v1
