# Case 3: fault only for one CALLER. sourceLabels matches the labels of the
# pod sending the request. Calls from reviews fail; calls from curl work.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: ratings
  namespace: bookinfo
spec:
  hosts:
  - ratings
  http:
  - match:
    - sourceLabels:
        app: reviews
    fault:
      abort:
        percentage:
          value: 100
        httpStatus: 500
    route:
    - destination:
        host: ratings
        subset: v1
  - route:
    - destination:
        host: ratings
        subset: v1
