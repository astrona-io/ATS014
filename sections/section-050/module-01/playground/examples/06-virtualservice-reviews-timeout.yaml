# reviews v2 calls ratings (slow, 2s). Give up after 0.5s.
# The timeout is set on the route the CALLER uses (curl -> reviews), not on
# ratings. A route with "fault" ignores its own timeout, so the delay and the
# timeout must be on different VirtualServices.
# Needs the reviews DestinationRule (subset v2), which the playground installs.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: reviews
  namespace: bookinfo
spec:
  hosts:
  - reviews
  http:
  - route:
    - destination:
        host: reviews
        # v2 calls ratings (v1 does not), so the delay is visible.
        subset: v2
    timeout: 0.5s
