# Test client inside the mesh.
# Send test requests from this pod with:
#   kubectl exec -n bookinfo deploy/curl -- curl -s http://<service>:<port>/...
# Because it has a sidecar, VirtualService and DestinationRule rules are applied
# to its outgoing requests, exactly like for a real app.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: curl
  namespace: bookinfo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl
  namespace: bookinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curl
  template:
    metadata:
      labels:
        app: curl
    spec:
      serviceAccountName: curl
      # Stop instantly on delete; nothing to drain in a test client.
      terminationGracePeriodSeconds: 0
      containers:
      - name: curl
        image: curlimages/curl:8.11.1
        # Keep the container running so we can exec into it.
        command: ["sleep", "infinity"]
