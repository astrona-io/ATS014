# Fault Injection With Delays And Aborts (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, installs Istio and Bookinfo, then stays running
# for free exploration. No task, no grading, no `astrona submit`.
#   astrona run -c .                          new kind cluster "astro-ats-014-playground-050-01"
#   astrona destroy ats-014-playground-050-01 delete the cluster again
metadata:
  name: "ats-014-playground-050-01"
  docs:
    guide: "docs/overview.md"

# Port forwards: astrona keeps these running on 127.0.0.1 (astrona port-forward list).
runtime:
  type: kind
  portForwards:
    - name: bookinfo-ui
      resource: svc/productpage
      namespace: bookinfo
      hostPort: 9080
      targetPort: 9080
      scheme: http
      description: "Bookinfo UI – open /productpage and log in as jason to see the faults"

bootstrap:
  init:
    - name: "install-istio"
      description: "Istio 1.30.5 (istio-base + istiod) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Namespace bookinfo, access logs, Bookinfo, curl and httpbin, and the reviews and ratings subsets"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
