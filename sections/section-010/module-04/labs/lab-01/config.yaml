metadata:
  name: "ats-014-lab-010-04-01"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-010-04-01-workloads"
      description: "Creates the starfleet namespace with the probe v1 and v2, its DestinationRule with the subsets v1 and v2, the shuttle client and mesh-wide access logs, and no VirtualService"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-delegated-route-table"
      description: "Confirms the root VirtualService has three rules (two delegates and a default), that the delegates have no hosts and no gateways, and that real requests from the shuttle prove the routing, the 2 second timeout and the proxy's route table"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
