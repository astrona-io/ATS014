metadata:
  name: "ats-014-lab-010-01-05"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-010-05-workloads"
      description: "Creates the starfleet namespace with the echo probe (v1 and v2), the shuttle client and mesh-wide access logs"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"
    - name: "lab-010-05-fault"
      description: "Applies the starting state: the probe Service port renamed to tcp, plus a correct probe DestinationRule and an http VirtualService that is never read"
      type: "file"
      source: "bootstrap/03-seed-fault.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-http-routing-back"
      description: "Confirms the probe Service port 8000 is declared as HTTP with its numbers and selector unchanged, the probe is back in the shuttle's route table, the flight plan keeps its http rule, and live signals with x-mission: test reach probe-v2 while all others reach probe-v1"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
