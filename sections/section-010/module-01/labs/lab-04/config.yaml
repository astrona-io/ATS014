metadata:
  name: "ats-014-lab-010-01-04"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-010-04-workloads"
      description: "Creates the starfleet namespace with the Starfleet (bridge, cargo, scout v1-v3, navcom), the shuttle client and mesh-wide access logs"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"
    - name: "lab-010-04-fault"
      description: "Applies the starting state: a correct scout DestinationRule, and a scout VirtualService in the wrong namespace with its catch-all first and a subset typo"
      type: "file"
      source: "bootstrap/03-seed-fault.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-flight-plan-repaired"
      description: "Confirms exactly one VirtualService describes scout.starfleet.svc.cluster.local and none uses the short host on another planet, jason's rule comes first with subset v2 and the catch-all sends to v1, istioctl analyze -A is clean for it, and live signals reach scout-v2 for jason and scout-v1 for everyone else"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
