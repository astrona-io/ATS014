metadata:
  name: "ats-014-lab-010-01"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-010-01-setup"
      description: "Creates the routing-demo namespace with two versions of notification-service and a tester client, and no Istio traffic configuration"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-request-routing"
      description: "Confirms the DestinationRule defines v1 and v2 subsets over the version label, that the VirtualService routes the header, URI-prefix and query-parameter cases to v2 with the default last, and that live traffic proves the rule order is correct"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
