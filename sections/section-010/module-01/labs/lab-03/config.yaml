metadata:
  name: "ats-014-lab-010-01-03"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-010-03-workloads"
      description: "Creates the starfleet namespace with the Starfleet (bridge, cargo, scout v1-v3, navcom), the shuttle client and mesh-wide access logs"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"
    - name: "lab-010-03-fault"
      description: "Applies the starting state: a scout DestinationRule whose v2 subset selects a label no pod has, and a correct VirtualService that sends jason to v2"
      type: "file"
      source: "bootstrap/03-seed-fault.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-docking-instructions"
      description: "Confirms the scout DestinationRule defines exactly v1, v2 and v3 over the version label, every subset has a healthy endpoint in the shuttle's proxy, the VirtualService is unchanged, and live signals reach scout-v2 for jason and scout-v1 for everyone else"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
