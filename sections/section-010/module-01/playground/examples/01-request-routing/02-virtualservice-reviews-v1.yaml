# Step 2: send ALL reviews traffic to subset v1.
# Applied after the DestinationRule, so subset v1 already exists
# ("make before break"). Applied first, requests would fail with 503.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: reviews
  namespace: bookinfo
spec:
  # Requests to this host are handled by the rules below.
  hosts:
  - reviews
  http:
  # No match: applies to every request.
  - route:
    - destination:
        host: reviews
        # Must be a subset name from the DestinationRule.
        subset: v1
