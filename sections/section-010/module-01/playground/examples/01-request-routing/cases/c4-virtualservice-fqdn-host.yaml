# Case 4: full service names (FQDN) instead of short names.
# Same result as the short name, and safe if the VirtualService ever lives in
# another namespace (short names resolve in the VirtualService's namespace).
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: scout
  namespace: starfleet
spec:
  hosts:
  - scout.starfleet.svc.cluster.local
  http:
  - route:
    - destination:
        host: scout.starfleet.svc.cluster.local
        subset: v1
