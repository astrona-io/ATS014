# Case 6 (mistake): only the jason rule, no catch-all route.
# Requests that match no rule have no route at all -> HTTP 404 (flag NR).
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: scout
  namespace: starfleet
spec:
  hosts:
  - scout
  http:
  - match:
    - headers:
        end-user:
          exact: jason
    route:
    - destination:
        host: scout
        subset: v2
