# MISTAKE ON PURPOSE: catch-all rule placed FIRST.
# Every request matches rule 1, so rule 2 (jason -> v2) is never reached.
# Apply it to see the effect, then re-apply 01-... to fix it.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: reviews
  namespace: bookinfo
spec:
  hosts:
  - reviews
  http:
  # Rule 1: no match = matches everything. Shadows the rule below.
  - route:
    - destination:
        host: reviews
        subset: v1
  # Rule 2: never used.
  - match:
    - headers:
        end-user:
          exact: jason
    route:
    - destination:
        host: reviews
        subset: v2
