metadata:
  name: "ats-014-capstone-010-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "capstone-010-02-setup"
      description: "Creates the namespaces starfleet, dock and depot with sidecar injection, the probe v1 and v2 in starfleet, mesh-wide access logs and a shuttle client in each namespace, and no Istio traffic configuration"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-section-010-capstone-2"
      description: "Confirms a DestinationRule and a root VirtualService exported to starfleet and dock, two delegates with no hosts that match the x-canary header and set different timeouts, and proves with real requests from starfleet, dock and depot that the header, the path, the timeouts and the export lists all behave as designed"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
