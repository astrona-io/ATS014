# The shuttle: a test client pod with a sidecar proxy in the namespace "dock".
# Send test requests from it with:
#   kubectl exec -n dock deploy/shuttle -- curl -s http://<service>:<port>/...
# Its sidecar proxy applies VirtualService and DestinationRule rules to the
# requests it sends, in the same way as for a real application.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shuttle
  namespace: dock
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: dock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      serviceAccountName: shuttle
      # Nothing to drain in a test client, so stop at once on delete.
      terminationGracePeriodSeconds: 0
      containers:
      - name: shuttle
        image: curlimages/curl:8.11.1
        # Keep the container running so that kubectl exec works.
        command: ["sleep", "infinity"]
