metadata:
  name: "ats-014-capstone-010"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "capstone-010-setup"
      description: "Creates the storefront, partners and archive namespaces with two versions of catalog, a partner backend, a workload nobody calls, and no Istio traffic configuration"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-section-010-capstone"
      description: "Confirms the full specification: catalog subsets over the version label, three routing rules reaching v2 with a reachable default on v1, a namespace-wide Sidecar scoping storefront to its own namespace plus istio-system and partners, archive scoped out and unreachable while still running, and the workloads left intact"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
