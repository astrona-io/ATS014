metadata:
  name: "ats-014-lab-010-02-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-010-02-02-workloads"
      description: "Creates the namespaces starfleet (shuttle, cargo) and outpost (probe v1/v2) and mesh-wide access logs"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"
    - name: "lab-010-02-02-fault"
      description: "Applies the starting state: a correct namespace-wide default Sidecar in starfleet, and a selector Sidecar for the shuttle that lists only its own namespace"
      type: "file"
      source: "bootstrap/03-seed-fault.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-shuttle-star-chart"
      description: "Confirms shuttle-only still selects the shuttle with REGISTRY_ONLY and now lists its own namespace, istio-system and outpost, the namespace default is unchanged, the shuttle's proxy holds the probe and istiod destinations, and live requests reach the probe through its own cluster"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
