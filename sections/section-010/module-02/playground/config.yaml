# Scope Proxy Configuration With The Sidecar Resource — Playground environment
# A clean sandbox: it spins up, installs Istio, two planets and their ships,
# then stays running for free exploration. No task, no grading, no `astrona submit`.
#   astrona run -c .                          new kind cluster "astro-ats-014-playground-010-02"
#   astrona destroy ats-014-playground-010-02  delete the cluster again
metadata:
  name: "ats-014-playground-010-02"
  docs:
    guide: "docs/overview.md"

runtime:
  type: kind

bootstrap:
  init:
    - name: "install-istio"
      description: "Istio 1.30.5 (istio-base + istiod) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Planets starfleet (shuttle, cargo) and outpost (probe v1/v2), access logs"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
