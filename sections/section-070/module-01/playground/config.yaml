# Control External Access With ServiceEntry (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, installs Istio and the test apps, then stays
# running for free exploration. No task, no grading, no `astrona submit`.
#   astrona run -c .                          new kind cluster "astro-ats-014-playground-070-01"
#   astrona destroy ats-014-playground-070-01   delete the cluster again
# Needs outbound internet access (httpbin.org).

metadata:
  name: "ats-014-playground-070-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Istio (istiod) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Namespace bookinfo (injected), mesh-wide access logs, curl client and httpbin v1/v2"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
