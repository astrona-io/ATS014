# Lock down outgoing traffic for the starfleet namespace.
# REGISTRY_ONLY: sidecars only let traffic out to hosts that are in Istio's
# service registry (Kubernetes Services + ServiceEntries). Anything else is
# blocked. The mesh default is ALLOW_ANY (everything goes out).
# This is a per-namespace override of meshConfig.outboundTrafficPolicy.
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  # No workloadSelector -> applies to all pods in the namespace.
  # Only one such Sidecar per namespace; "default" is the usual name.
  name: default
  namespace: starfleet
spec:
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY
  egress:
  - hosts:
    # Services (and ServiceEntries) in this namespace.
    - "./*"
    # Services in istio-system.
    - "istio-system/*"
