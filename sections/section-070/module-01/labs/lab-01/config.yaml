metadata:
  name: "ats-014-lab-070-01"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane with outboundTrafficPolicy set to REGISTRY_ONLY"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-070-01-setup"
      description: "Creates the egress-demo namespace with a client, plus two unregistered endpoints outside the mesh registry to stand in for external services"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

validation:
  scripts:
    - name: "verify-service-entry"
      description: "Confirms the mesh is REGISTRY_ONLY, that a ServiceEntry registers exactly one external endpoint with the right location and resolution, that a VirtualService timeout applies to it, and that the second endpoint is still refused"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
