metadata:
  name: "ats-014-lab-070-03"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-070-03-setup"
      description: "Creates the vm-demo namespace with a client, a service account, and two uninjected pods standing in for virtual machines"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-workload-entry"
      description: "Confirms two WorkloadEntry objects with identity, a MESH_INTERNAL ServiceEntry selecting both by label, a matching WorkloadGroup template, and that the host resolves to both endpoints with traffic reaching them"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
