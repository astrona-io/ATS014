# Add Virtual Machines To The Mesh — Playground environment
# A clean sandbox: it spins up, installs Istio, the shuttle and two stand-in
# "virtual machines", then stays running for free exploration.
# No task, no grading, no `astrona submit`.
#   astrona run -c .                          new kind cluster "astro-ats-014-playground-070-03"
#   astrona destroy ats-014-playground-070-03  delete the cluster again
metadata:
  name: "ats-014-playground-070-03"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Istio 1.30.5 (istio-base + istiod with DNS capture) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Namespace starfleet, access logs, the shuttle client and two uninjected freighters standing in for virtual machines"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
