metadata:
  name: "ats-014-capstone-070"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: kind
  kind:
    # Loaded into the node from the host cache: Istio and the workloads start
    # without a registry pull on every run.
    preloadImages:
      - "registry.istio.io/release/pilot:1.30.5"
      - "registry.istio.io/release/proxyv2:1.30.5"
      - "nginx:1.27-alpine"
      - "mccutchen/go-httpbin:v2.15.0"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane with outboundTrafficPolicy REGISTRY_ONLY"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "capstone-070-setup"
      description: "Creates the integrations namespace with a client, a TLS-only partner endpoint, an uninjected legacy machine, and an endpoint that must stay blocked"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-section-070-capstone"
      description: "Confirms a deny-by-default mesh with one external host registered and TLS-originated, one non-Kubernetes workload brought in as MESH_INTERNAL with identity, and a third endpoint still refused"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
