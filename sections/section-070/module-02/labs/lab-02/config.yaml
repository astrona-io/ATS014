metadata:
  name: "ats-014-lab-070-02-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-070-02-02-workloads"
      description: "Creates the starfleet namespace with the shuttle client and mesh-wide access logs, and the outpost namespace with a TLS-only vault pod outside the mesh"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"
    - name: "lab-070-02-02-fault"
      description: "Applies the starting state: a correct vault ServiceEntry, a VirtualService that matches the wrong port, and a DestinationRule that sets TLS on the wrong port"
      type: "file"
      source: "bootstrap/03-seed-fault.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-sealed-channel"
      description: "Confirms the ServiceEntry is unchanged, the VirtualService moves port 8080 to 8443, the DestinationRule sets TLS on port 8443 only with sni, the shuttle's proxy holds TLS for 8443 only, and a plain http:// request reaches the TLS-only vault, which reports scheme=https"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
