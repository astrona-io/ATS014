# TLS Origination For External Services — Playground environment
# A clean sandbox: it spins up, installs Istio, the shuttle and the probe, then
# stays running for free exploration. No task, no grading, no `astrona submit`.
#   astrona run -c .                           new kind cluster "astro-ats-014-playground-070-02"
#   astrona destroy ats-014-playground-070-02   delete the cluster again
# Needs outbound internet access (httpbin.org).

metadata:
  name: "ats-014-playground-070-02"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Istio 1.30.5 (istio-base + istiod) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Namespace starfleet (injected), mesh-wide access logs, the shuttle client and probe v1/v2"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
