# httpbin test service in two versions (v1 and v2), behind one Service.
# httpbin answers with whatever you ask for, which makes Istio behaviour easy
# to see:
#   /get            echo the request
#   /headers        echo the request headers
#   /hostname       name of the pod that answered
#   /status/503     always return 503 (for retries)
#   /delay/3        wait 3 seconds (for timeouts)
# Used by the retries, circuit breaking and mirroring examples.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
  namespace: bookinfo
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: bookinfo
  labels:
    app: httpbin
spec:
  # Selects BOTH versions. Subsets in a DestinationRule split them by "version".
  selector:
    app: httpbin
  ports:
  # Port name "http" tells Istio the protocol (HTTP), so HTTP features work.
  - name: http
    port: 8000
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-v1
  namespace: bookinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
      version: v1
  template:
    metadata:
      labels:
        app: httpbin
        version: v1
    spec:
      serviceAccountName: httpbin
      containers:
      - name: httpbin
        image: mccutchen/go-httpbin:v2.15.0
        env:
        # Make /hostname return the real pod name, so tests can see which
        # pod answered.
        - name: USE_REAL_HOSTNAME
          value: "true"
        ports:
        - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-v2
  namespace: bookinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
      version: v2
  template:
    metadata:
      labels:
        app: httpbin
        version: v2
    spec:
      serviceAccountName: httpbin
      containers:
      - name: httpbin
        image: mccutchen/go-httpbin:v2.15.0
        env:
        # Make /hostname return the real pod name, so tests can see which
        # pod answered.
        - name: USE_REAL_HOSTNAME
          value: "true"
        ports:
        - containerPort: 8080
