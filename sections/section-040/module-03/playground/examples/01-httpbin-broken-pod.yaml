# A broken extra pod behind the httpbin Service: always answers HTTP 503.
# Same label app=httpbin, so the Service sends it ~1/3 of the requests.
# Used to show outlier detection removing a bad pod from load balancing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-broken
  namespace: bookinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
      version: broken
  template:
    metadata:
      labels:
        app: httpbin
        version: broken
    spec:
      containers:
      - name: http-echo
        image: hashicorp/http-echo:1.0
        args:
        - -listen=:8080
        - -status-code=503
        - -text=broken
        ports:
        - containerPort: 8080
