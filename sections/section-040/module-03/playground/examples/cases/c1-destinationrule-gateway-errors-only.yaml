# Case 1: count ONLY gateway errors (502, 503, 504) for ejection.
# consecutive5xxErrors defaults to 5 as soon as outlierDetection is set, so it
# must be switched off with 0 – otherwise a pod answering 500 is still
# ejected after 5 errors in a row.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: httpbin
  namespace: bookinfo
spec:
  host: httpbin
  trafficPolicy:
    outlierDetection:
      consecutiveGatewayErrors: 3
      consecutive5xxErrors: 0
      interval: 5s
      baseEjectionTime: 1m
      maxEjectionPercent: 50
