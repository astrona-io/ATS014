# Case 1 helper: a broken ship behind the probe that answers 500 (not 503).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-broken-500
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
      version: broken-500
  template:
    metadata:
      labels:
        app: probe
        version: broken-500
    spec:
      containers:
      - name: http-echo
        image: hashicorp/http-echo:1.0
        args: ["-listen=:8080", "-status-code=500", "-text=broken"]
        ports:
        - containerPort: 8080
