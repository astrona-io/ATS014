# Outlier Detection And Endpoint Ejection — Playground environment
# A clean sandbox: no task, no grading, no `astrona submit`.
#   astrona run -c .                           new kind cluster "astro-ats-014-playground-040-03" + Istio + apps
#   astrona destroy ats-014-playground-040-03  delete the cluster again
# Istio 1.30.5 is installed with Helm (istio-base + istiod, no gateways).
# Namespace starfleet holds the shuttle, the probe (v1 + v2) and fortio. See docs/overview.md.
metadata:
  name: "ats-014-playground-040-03"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Istio 1.30.5 (istio-base + istiod) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Namespace starfleet with access logs, the shuttle, the probe v1/v2 and the fortio load generator"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
