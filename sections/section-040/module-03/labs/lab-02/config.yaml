metadata:
  name: "ats-014-lab-040-03-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-040-03-02-workloads"
      description: "Creates the starfleet namespace with the probe v1/v2, the shuttle client, the fortio load generator and mesh-wide access logs"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"
    - name: "lab-040-03-02-fault"
      description: "Applies the starting state: a third probe pod that answers every request with 503, and no DestinationRule"
      type: "file"
      source: "bootstrap/03-seed-fault.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-both-shields"
      description: "Confirms one probe DestinationRule holds the required connection pool and outlier detection, that fortio's proxy refuses overflow requests, that the shuttle's proxy ejects the broken pod, and that Kubernetes still lists it"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
