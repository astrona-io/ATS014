metadata:
  name: "ats-014-lab-040-03"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: kind
  kind:
    # Loaded into the node from the host cache: Istio and the workloads start
    # without a registry pull on every run.
    preloadImages:
      - "registry.istio.io/release/pilot:1.30.5"
      - "registry.istio.io/release/proxyv2:1.30.5"
      - "nginx:1.27-alpine"
      - "mccutchen/go-httpbin:v2.15.0"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-040-03-setup"
      description: "Creates the outlier-demo namespace with one healthy backend and one that returns 503 to everything while passing its readiness probe, behind one Service, plus a tester client"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-outlier-detection"
      description: "Confirms the outlier detection fields are set with a maxEjectionPercent that can actually act, that the policy is live in the proxy, that driving traffic ejects the failing endpoint, and that the ejection is visible in the proxy while Kubernetes still lists the pod as a ready endpoint"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
