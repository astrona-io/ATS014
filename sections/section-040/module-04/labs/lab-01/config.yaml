metadata:
  name: "ats-014-lab-040-04"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: kind
  kind:
    # Loaded into the node from the host cache: Istio and the workloads start
    # without a registry pull on every run.
    preloadImages:
      - "registry.istio.io/release/pilot:1.30.5"
      - "registry.istio.io/release/proxyv2:1.30.5"
      - "nginx:1.27-alpine"
      - "mccutchen/go-httpbin:v2.15.0"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-040-04-setup"
      description: "Creates the locality-demo namespace with a zone-a backend that returns 503 to everything, a healthy zone-b backend, and a tester client, with localities declared by pod label"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-locality-failover"
      description: "Confirms endpoints carry localities, that outlierDetection and localityLbSetting are both present with a maxEjectionPercent that can act, that the failing zone is ejected, and that traffic ends up in the healthy zone"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
