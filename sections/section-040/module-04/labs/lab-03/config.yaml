metadata:
  name: "ats-014-lab-040-04-03"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-040-04-03-workloads"
      description: "Labels the node region local / zone zone-a and creates the starfleet namespace with the shuttle, probe-zone-a, probe-zone-b and mesh-wide access logs"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"
    - name: "lab-040-04-03-fault"
      description: "Applies the starting state: a probe DestinationRule with outlierDetection and localityLbSetting that keeps every signal in zone-a, so probe-zone-b gets none"
      type: "file"
      source: "bootstrap/03-seed-fault.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-split"
      description: "Confirms the probe DestinationRule distributes signals from local/zone-a/* with weights 80 to zone-a and 20 to zone-b and no failover, the ships and Service are unchanged, and 100 live signals land in about those shares"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
