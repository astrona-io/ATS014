metadata:
  name: "ats-014-lab-040-05-01"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-040-05-01-workloads"
      description: "Labels the node region local / zone zone-a and creates the starfleet namespace with the shuttle, the probe in two zones and mesh-wide access logs. No DestinationRule exists yet"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-connection-settings"
      description: "Confirms the proxy of the shuttle holds the connect timeout, idle timeout, maximum connection duration and TCP keepalive values for the probe cluster, that the DestinationRule is the only Istio object for the probe, that the workloads are unchanged, and that 10 live requests return 200"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
