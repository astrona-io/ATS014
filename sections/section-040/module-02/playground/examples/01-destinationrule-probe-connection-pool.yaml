# Circuit breaker part 1: connection pool limits for probe.
# Very low limits on purpose, so a small load test trips them.
# When the limits are full, the caller's sidecar fails extra requests fast
# with HTTP 503 (response flag UO = upstream overflow) instead of queueing
# them and overloading probe.
# Both ends enforce the limits: each caller sidecar on what it sends, and
# each probe pod's sidecar on what it accepts (its inbound cluster).
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: probe
  namespace: starfleet
spec:
  host: probe
  trafficPolicy:
    connectionPool:
      tcp:
        # Max open TCP connections (per caller, and per probe pod).
        maxConnections: 1
      http:
        # Max requests waiting for a free connection. More = 503 at once.
        http1MaxPendingRequests: 1
        # Close the connection after each request (no keep-alive), so every
        # request needs a free connection slot.
        maxRequestsPerConnection: 1
