# Case 1: same single connection, but up to 10 requests may WAIT for it.
# With 3 parallel clients nothing overflows: requests queue instead of 503.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: probe
  namespace: starfleet
spec:
  host: probe
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1
      http:
        http1MaxPendingRequests: 10
        maxRequestsPerConnection: 1
