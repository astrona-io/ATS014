# Case 2 (common mistake): only maxConnections set. The pending queue keeps
# its huge default, so extra requests wait – the breaker never trips.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: probe
  namespace: starfleet
spec:
  host: probe
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1
