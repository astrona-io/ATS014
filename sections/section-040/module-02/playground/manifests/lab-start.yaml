apiVersion: v1
kind: Namespace
metadata:
  name: circuit-demo
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-v1
  namespace: circuit-demo
  labels:
    app: notification-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
      version: v1
  template:
    metadata:
      labels:
        app: notification-service
        version: v1
    spec:
      containers:
        - name: notification-service
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8084
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-conf
          configMap:
            name: notification-service-v1-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: circuit-demo
  labels:
    app: notification-service
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8084
  selector:
    app: notification-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  namespace: circuit-demo
  labels:
    app: fortio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
      annotations:
        # Istio ships a stats filter that keeps only a small set of Envoy
        # counters; per-cluster ones such as upstream_rq_pending_overflow are
        # not in it. This annotation adds them back for this workload's proxy,
        # which is what makes the circuit-breaker counters readable at all.
        sidecar.istio.io/statsInclusionPrefixes: "cluster.outbound"
    spec:
      containers:
        - name: fortio
          image: fortio/fortio:latest_release
          args: ["server"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-v1-nginx-conf
  namespace: circuit-demo
data:
  default.conf: |
    server {
      listen 8084;
      location / {
        default_type application/json;
        return 200 '["EMAIL"]';
      }
    }
