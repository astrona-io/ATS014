metadata:
  name: "ats-014-lab-040-02"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: kind
  kind:
    # Loaded into the node from the host cache: Istio and the workloads start
    # without a registry pull on every run.
    preloadImages:
      - "registry.istio.io/release/pilot:1.30.5"
      - "registry.istio.io/release/proxyv2:1.30.5"
      - "nginx:1.27-alpine"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-040-02-setup"
      description: "Creates the circuit-demo namespace with a backend and a fortio load generator, and no DestinationRule"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-circuit-breaking"
      description: "Confirms the connection pool limits are configured and live in the proxy, that a sequential load still succeeds, that a concurrent load is rejected, and that the rejections carry the UO flag and move the pending-overflow counter while the backend sees nothing"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
