metadata:
  name: "ats-014-capstone-040-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "capstone-040-02-workloads"
      description: "Labels the node region local / zone zone-a and creates the starfleet namespace with the shuttle, a probe in zone-a that answers 503 to every request while staying ready, a healthy probe in zone-b and mesh-wide access logs"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-capstone-040-02"
      description: "Confirms the DestinationRule connection settings in the shuttle's proxy, the route timeout and retry fields, PreferClose on the Service, outlier detection that can eject, that no workload was scaled or removed, and with live requests that the failing zone-a probe is ejected so every request returns 200 from probe-zone-b, while a slow request fails with 504 within the timeout"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
