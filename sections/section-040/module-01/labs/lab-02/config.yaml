metadata:
  name: "ats-014-lab-040-01-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-040-01-02-workloads"
      description: "Creates the starfleet namespace with the Starfleet (bridge, cargo, scout v1-v3, navcom), the shuttle client and mesh-wide access logs"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"
    - name: "lab-040-01-02-fault"
      description: "Applies the starting state: jason flies to scout v2, navcom is delayed 3s by a fault, and the 1s timeout sits uselessly on the same navcom route as the fault"
      type: "file"
      source: "bootstrap/03-seed-fault.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-abort-window-on-the-caller"
      description: "Confirms navcom keeps its 3s delay drill with no timeout, jason's scout rule carries a timeout of at most 1s, jason's signals get a 504 within about 1s made by the shuttle's own sidecar (UT), and everyone else still gets a fast 200"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
