metadata:
  name: "ats-014-lab-040-01"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: kind
  kind:
    # Loaded into the node from the host cache: Istio and the workloads start
    # without a registry pull on every run.
    preloadImages:
      - "registry.istio.io/release/pilot:1.30.5"
      - "registry.istio.io/release/proxyv2:1.30.5"
      - "mccutchen/go-httpbin:v2.15.0"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-040-01-setup"
      description: "Creates the resilience-demo namespace with an httpbin whose /delay and /status endpoints make failure controllable, plus a tester client"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-timeouts-and-retries"
      description: "Confirms a POST rule disables retries above a read rule that retries on gateway errors, that the read timeout covers the full retry budget, and that live traffic shows four attempts for a retried read and exactly one for a POST"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
