# Case 1: timeout LONGER than the delay. reviews v2 waits 2s for ratings,
# the timeout is 3s, so the request succeeds (slowly).
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: reviews
  namespace: bookinfo
spec:
  hosts:
  - reviews
  http:
  - route:
    - destination:
        host: reviews
        subset: v2
    timeout: 3s
