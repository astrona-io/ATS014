# Case 4: different timeouts per path. /delay/* gets 2s, everything else has
# no timeout. Each http rule has its own timeout.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: httpbin
  namespace: bookinfo
spec:
  hosts:
  - httpbin
  http:
  - match:
    - uri:
        prefix: /delay
    route:
    - destination:
        host: httpbin
    timeout: 2s
  - route:
    - destination:
        host: httpbin
