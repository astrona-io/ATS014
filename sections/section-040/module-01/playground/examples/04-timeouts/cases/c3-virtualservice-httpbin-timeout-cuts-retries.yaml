# Case 3: the overall timeout also limits retries.
# Each try may take 1s and 3 retries are allowed (up to 4 tries = 4s), but the
# whole request may only take 1.5s – so only 2 tries happen.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: httpbin
  namespace: bookinfo
spec:
  hosts:
  - httpbin
  http:
  - route:
    - destination:
        host: httpbin
    timeout: 1.5s
    retries:
      attempts: 3
      perTryTimeout: 1s
      retryOn: 5xx
