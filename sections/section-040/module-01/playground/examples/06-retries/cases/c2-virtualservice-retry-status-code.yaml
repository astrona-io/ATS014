# Case 2: retry on one exact status code. A number in retryOn means
# "retry when the response has this status code".
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: httpbin
  namespace: bookinfo
spec:
  hosts:
  - httpbin
  http:
  - route:
    - destination:
        host: httpbin
    retries:
      attempts: 3
      retryOn: "503"
