# Case 3: retry SLOW requests. Each try may take 1s; a try that takes longer
# is cancelled and retried (a per-try timeout counts as a 5xx).
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: httpbin
  namespace: bookinfo
spec:
  hosts:
  - httpbin
  http:
  - route:
    - destination:
        host: httpbin
    timeout: 10s
    retries:
      attempts: 2
      perTryTimeout: 1s
      retryOn: 5xx
