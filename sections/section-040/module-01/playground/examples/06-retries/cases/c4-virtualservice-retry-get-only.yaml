# Case 4: retry only GET (safe to repeat). POST gets no retries at all.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: httpbin
  namespace: bookinfo
spec:
  hosts:
  - httpbin
  http:
  - match:
    - method:
        exact: GET
    route:
    - destination:
        host: httpbin
    retries:
      attempts: 3
      retryOn: 5xx
  - route:
    - destination:
        host: httpbin
    retries:
      attempts: 0
