# Retry failed requests to httpbin up to 3 times.
# Retries are done by the CALLER's sidecar. The app sees one request and one
# answer; the extra attempts are hidden from it.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: httpbin
  namespace: bookinfo
spec:
  hosts:
  - httpbin
  http:
  - route:
    - destination:
        host: httpbin
    retries:
      # Max retries AFTER the first try. 3 = up to 4 requests in total.
      attempts: 3
      # Time limit for each single try (first try included).
      perTryTimeout: 2s
      # When to retry. 5xx = any 5xx response from the app.
      # Istio's default retry policy (always on, 2 attempts) only covers
      # connection-level errors, NOT a 503 returned by the app.
      retryOn: 5xx,connect-failure,reset
    # Overall limit for the request including all retries.
    timeout: 10s
