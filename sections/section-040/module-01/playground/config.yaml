# Timeouts And Retries (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, installs Istio and the Bookinfo apps, then stays
# running for free exploration. No task, no grading, no `astrona submit`.
#   astrona run -c .                          new kind cluster "astro-ats-014-playground-040-01"
#   astrona destroy ats-014-playground-040-01 delete the cluster again
metadata:
  name: "ats-014-playground-040-01"
  docs:
    guide: "docs/overview.md"

# Port forwards: astrona keeps these running on 127.0.0.1 (astrona port-forward list).
runtime:
  type: kind
  portForwards:
    - name: bookinfo-ui
      resource: svc/productpage
      namespace: bookinfo
      hostPort: 9080
      targetPort: 9080
      scheme: http
      description: "Bookinfo UI – open /productpage, refresh to see the stars change"

bootstrap:
  init:
    - name: "install-istio"
      description: "Istio (istio-base + istiod) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Namespace bookinfo, access logs, Bookinfo, httpbin v1/v2, curl client, reviews subsets and the jason → v2 route"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
