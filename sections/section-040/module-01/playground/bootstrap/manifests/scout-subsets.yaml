# DestinationRule for scout: three subsets, one per version label (v1, v2, v3).
# Applied first, so the scout VirtualService can name the subsets.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: scout
  namespace: starfleet
spec:
  host: scout
  subsets:
  # version=v1: no stars, does not call navcom.
  - name: v1
    labels:
      version: v1
  # version=v2: black stars, calls navcom.
  - name: v2
    labels:
      version: v2
  # version=v3: red stars, calls navcom.
  - name: v3
    labels:
      version: v3
