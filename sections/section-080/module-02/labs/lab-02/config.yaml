metadata:
  name: "ats-014-lab-080-02-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 with Helm: istio-base, istiod with DNS capture, and the egress gateway in istio-egress"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-080-02-02-workloads"
      description: "Creates the starfleet namespace with the shuttle and access logs, the partner server in namespace outpost that only accepts mutual TLS, and the partner's client certificate as a Secret in starfleet"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"
    - name: "lab-080-02-02-fault"
      description: "Applies the starting state: the partner route through the egress gateway with MUTUAL origination, stage 2 routed to port 80, and no client certificate Secret in istio-egress"
      type: "file"
      source: "bootstrap/03-seed-fault.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-mutual-tls-at-the-gate"
      description: "Confirms stage 2 routes to port 443, the MUTUAL DestinationRule is unchanged, the client certificate Secret is in istio-egress and loaded by the egress gateway, the shuttle holds no TLS settings or keys for the partner, and a live plain request reaches the partner with verify=SUCCESS through the egress gateway"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
