metadata:
  name: "ats-014-lab-080-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane including the egress gateway"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-080-02-setup"
      description: "Creates the egwtls-demo namespace with a client, and a TLS-only endpoint outside the mesh that reports the scheme it was reached over"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-egress-gateway-tls-origination"
      description: "Confirms the five-object chain: both ports declared, a gateway listener on 8080, a two-stage VirtualService whose gateway stage targets 8443, and an origination DestinationRule on the external host - proven by the gateway log, the transportSocket comparison, and the endpoint reporting scheme=https"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
