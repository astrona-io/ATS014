# TLS Origination At The Egress Gateway (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, installs Istio, the egress gateway, the shuttle
# and a partner server in namespace outpost that only accepts mutual TLS, then stays running for
# free exploration. No task, no grading, no `astrona submit`.
#   astrona run -c .                          new kind cluster "astro-ats-014-playground-080-02"
#   astrona destroy ats-014-playground-080-02   delete the cluster again
# Needs outbound internet access (httpbin.org) and openssl on your machine.

metadata:
  name: "ats-014-playground-080-02"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Istio (istiod with DNS capture, egress gateway in istio-egress) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Namespace starfleet (injected), access logs, the shuttle, and the partner server in namespace outpost that only accepts mutual TLS"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
