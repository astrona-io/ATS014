# Route External Traffic Through An Egress Gateway (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, installs Istio, the egress gateway and the shuttle, then stays
# running for free exploration. No task, no grading, no `astrona submit`.
#   astrona run -c .                          new kind cluster "astro-ats-014-playground-080-01"
#   astrona destroy ats-014-playground-080-01   delete the cluster again
# Needs outbound internet access (httpbin.org).

metadata:
  name: "ats-014-playground-080-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Istio (istiod, egress gateway in istio-egress) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Namespace starfleet (injected), mesh-wide access logs and the shuttle client"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
