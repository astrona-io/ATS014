metadata:
  name: "ats-014-lab-020-02-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-020-02-02-workloads"
      description: "Creates the starfleet namespace with the probe v1/v2, the shuttle client and mesh-wide access logs"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"
    - name: "lab-020-02-02-fault"
      description: "Applies the starting state: a VirtualService that mirrors every request to subset v2, and a DestinationRule whose v2 subset selects a label no pod has"
      type: "file"
      source: "bootstrap/03-seed-fault.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-quiet-shadow"
      description: "Confirms the probe DestinationRule defines v1 and v2 over the version label, the VirtualService still routes to v1 and mirrors to v2, the mirror cluster has endpoints, every response to the client comes from v1, and probe-v2 really receives the copies"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
