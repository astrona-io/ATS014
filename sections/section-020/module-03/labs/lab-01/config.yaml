metadata:
  name: "ats-014-lab-020-03-01"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-020-03-01-workloads"
      description: "Creates the starfleet namespace with the probe v1/v2, the Services probe (http port) and probe-tcp (tcp port), the shuttle client and mesh-wide access logs"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-tcp-weighted-split"
      description: "Confirms the probe-tcp DestinationRule defines v1 and v2, the probe-tcp VirtualService has one tcp route matching port 8000 with weights 80 and 20, the shuttle's proxy holds both weighted clusters, one reused connection stays on one pod, and 150 fresh connections split close to 80/20"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
