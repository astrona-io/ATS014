metadata:
  name: "ats-014-lab-020-03-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-020-03-02-workloads"
      description: "Creates the starfleet namespace with the probe v1/v2, the shuttle client and mesh-wide access logs"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"
    - name: "lab-020-03-02-fault"
      description: "Applies the starting state: a Service probe-tcp whose port is named http, a DestinationRule whose v2 subset selects a label no pod has, and an 80/20 tcp VirtualService"
      type: "file"
      source: "bootstrap/03-seed-fault.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-tcp-split-happens"
      description: "Confirms the probe-tcp Service port is named tcp, the DestinationRule subsets select their pods, the VirtualService still holds the 80/20 tcp route, the shuttle's proxy holds the weighted clusters and the v2 cluster has a healthy endpoint, and 150 fresh connections split close to 80/20"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
