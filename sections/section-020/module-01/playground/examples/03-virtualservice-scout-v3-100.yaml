# Canary step 3: promote v3 to 100%.
# One destination = weight 100 implied, so "weight" can be left out.
# Rollback = re-apply step 1 (or a v1-only VirtualService).
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: scout
  namespace: starfleet
spec:
  hosts:
  - scout
  http:
  - route:
    - destination:
        host: scout
        subset: v3
