# Prerequisite: the subsets v1, v2 and v3 of the scout.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: scout
  namespace: starfleet
spec:
  host: scout
  subsets:
  # Ships labelled version=v1: no stars.
  - name: v1
    labels:
      version: v1
  # Ships labelled version=v2: black stars.
  - name: v2
    labels:
      version: v2
  # Ships labelled version=v3: red stars.
  - name: v3
    labels:
      version: v3
