metadata:
  name: "ats-014-lab-020-01"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: kind
  kind:
    # Loaded into the node from the host cache: Istio and the workloads start
    # without a registry pull on every run.
    preloadImages:
      - "registry.istio.io/release/pilot:1.30.5"
      - "registry.istio.io/release/proxyv2:1.30.5"
      - "nginx:1.27-alpine"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-020-01-setup"
      description: "Creates the shifting-demo namespace with two versions of notification-service and a tester client, and no Istio traffic configuration"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-weighted-routing"
      description: "Confirms the subsets exist, an internal-tester header rule pins to v2 above a 70/30 weighted rule, the proxy holds the matching weightedClusters, live traffic lands in the right proportion, and the Deployments were not scaled to fake the split"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
