metadata:
  name: "ats-014-lab-020-01-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-020-01-02-workloads"
      description: "Creates the starfleet namespace with the Starfleet (bridge, cargo, scout v1-v3, navcom), the shuttle client and mesh-wide access logs"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"
    - name: "lab-020-01-02-state"
      description: "Applies the starting state: the scout DestinationRule with subsets v1, v2 and v3, and a VirtualService that sends every scout signal to v1"
      type: "file"
      source: "bootstrap/03-seed-state.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-three-way-split"
      description: "Confirms the scout VirtualService is one route with v1 60, v2 30 and v3 10, the shuttle's proxy holds those weights, the DestinationRule and the ships are unchanged, and 200 live signals split in the expected bands"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
