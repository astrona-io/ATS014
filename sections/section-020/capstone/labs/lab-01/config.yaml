metadata:
  name: "ats-014-capstone-020"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "capstone-020-setup"
      description: "Creates the checkout namespace with a stable and a canary version behind one Service, a separate shadow deployment, and a tester client"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

validation:
  scripts:
    - name: "verify-section-020-capstone"
      description: "Confirms an internal-tester rule pins to v2 above a weighted 80/20 default, that the same default rule mirrors everything to the separate shadow service, that live traffic lands in the right proportion while the shadow receives every copy, and that no Deployment was scaled"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
