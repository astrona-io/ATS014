# Open port 80 on the ingress gateway for host starfleet.example.com.
# A Gateway only opens the port: on its own it routes nothing, so requests
# get HTTP 404 until a VirtualService is bound to it.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: starfleet-gateway
  namespace: starfleet
spec:
  # Gateway pods this applies to, by pod label. Check yours with:
  #   kubectl get pods -A -l istio=ingress --show-labels
  # Helm "gateway" chart installed as istio-ingress -> istio: ingress
  # istioctl install (default/demo profile)         -> istio: ingressgateway
  selector:
    istio: ingress
  servers:
  - port:
      # Port on the gateway Service (80 -> container port 8080 on the pod).
      number: 80
      name: http
      protocol: HTTP
    # Only requests with this Host header are accepted. "*" = any host.
    hosts:
    - starfleet.example.com
