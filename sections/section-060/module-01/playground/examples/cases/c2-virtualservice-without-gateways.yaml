# Case 2 (mistake): VirtualService WITHOUT spec.gateways.
# It then only applies to sidecars ("mesh"); the gateway has no route -> 404 NR.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: bridge
  namespace: starfleet
spec:
  hosts:
  - starfleet.example.com
  http:
  - match:
    - uri:
        exact: /productpage
    route:
    - destination:
        host: bridge
        port:
          number: 9080
