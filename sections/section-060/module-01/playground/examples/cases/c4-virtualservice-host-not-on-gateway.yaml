# Case 4 (mistake): VirtualService host shop.example.com is not in the
# Gateway's hosts (starfleet.example.com). The route is ignored by the gateway.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: bridge
  namespace: starfleet
spec:
  hosts:
  - shop.example.com
  gateways:
  - starfleet-gateway
  http:
  - route:
    - destination:
        host: bridge
        port:
          number: 9080
