# Same as 02, plus a second rule: /reviews/* from outside goes straight to the
# reviews service, v3 only. Shows that gateway VirtualServices use the same
# match/route/subset features as in-mesh ones.
# Needs the reviews DestinationRule (subset v3). The playground applies it at
# startup from bootstrap/manifests/reviews-subsets.yaml.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: bookinfo
  namespace: bookinfo
spec:
  hosts:
  - bookinfo.example.com
  gateways:
  - bookinfo-gateway
  http:
  # Rule 1: /reviews/<id> -> reviews v3.
  - match:
    - uri:
        prefix: /reviews/
    route:
    - destination:
        host: reviews
        subset: v3
        port:
          number: 9080
  # Rule 2: the productpage paths.
  - match:
    - uri:
        exact: /productpage
    - uri:
        prefix: /static
    - uri:
        exact: /login
    - uri:
        exact: /logout
    - uri:
        prefix: /api/v1/products
    route:
    - destination:
        host: productpage
        port:
          number: 9080
