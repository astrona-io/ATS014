# Expose A Service With An Istio Ingress Gateway (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, installs Istio and Bookinfo, then stays running
# for free exploration. No task, no grading, no `astrona submit`.
#   astrona run -c .                          new kind cluster "astro-ats-014-playground-060-01"
#   astrona destroy ats-014-playground-060-01 delete the cluster again
metadata:
  name: "ats-014-playground-060-01"
  docs:
    guide: "docs/overview.md"

# Port forwards: astrona keeps these running on 127.0.0.1 (astrona port-forward list).
runtime:
  type: kind
  portForwards:
    - name: bookinfo-ui
      resource: svc/productpage
      namespace: bookinfo
      hostPort: 9080
      targetPort: 9080
      scheme: http
      description: "Bookinfo UI – open /productpage, refresh to see the stars change"
    - name: ingress
      resource: svc/istio-ingress
      namespace: istio-ingress
      hostPort: 8080
      targetPort: 80
      scheme: http
      description: "Ingress gateway HTTP – send Host: bookinfo.example.com"

bootstrap:
  init:
    - name: "install-istio"
      description: "Istio 1.30.5 (istio-base, istiod, ingress gateway in istio-ingress) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Namespace bookinfo, access logs, Bookinfo, curl and httpbin, and the reviews subsets"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
