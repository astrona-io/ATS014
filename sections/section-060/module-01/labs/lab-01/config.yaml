metadata:
  name: "ats-014-lab-060-01"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: kind
  kind:
    # Loaded into the node from the host cache: Istio and the workloads start
    # without a registry pull on every run.
    preloadImages:
      - "registry.istio.io/release/pilot:1.30.5"
      - "registry.istio.io/release/proxyv2:1.30.5"
      - "nginx:1.27-alpine"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane including the ingress gateway"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-060-01-setup"
      description: "Creates the ingress-demo namespace with two backend services and no Gateway or VirtualService"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-ingress-gateway"
      description: "Confirms a Gateway opens an HTTP listener for the required hosts, that two VirtualServices bind to it and route by host, that the gateway proxy holds the routes, and that an unknown host is rejected"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
