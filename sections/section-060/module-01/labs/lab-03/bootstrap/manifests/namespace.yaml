# The planet for this playground: namespace "starfleet".
# The istio-injection=enabled label makes Istio put a sidecar proxy (the
# communications officer) into every pod created here.
# Pods created BEFORE the label was added get no sidecar; restart them with
# "kubectl rollout restart deploy -n starfleet".
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
  labels:
    istio-injection: enabled
