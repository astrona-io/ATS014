        imagePullPolicy: IfNotPresent
        env:
        - name: LOG_DIR
          value: /tmp/logs
        - name: RATINGS_HOSTNAME
          value: navcom
        ports:
        - containerPort: 9080
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: wlp-output
          mountPath: /opt/ibm/wlp/output
      volumes:
      - name: wlp-output
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout-v3
  labels:
    app: scout
    version: v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
      version: v3
  template:
    metadata:
      labels:
        app: scout
        version: v3
    spec:
      serviceAccountName: starfleet-scout
      containers:
      - name: scout
        image: registry.istio.io/release/examples-bookinfo-reviews-v3:1.20.3
        imagePullPolicy: IfNotPresent
        env:
        - name: LOG_DIR
          value: /tmp/logs
        - name: RATINGS_HOSTNAME
          value: navcom
        ports:
        - containerPort: 9080
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: wlp-output
          mountPath: /opt/ibm/wlp/output
      volumes:
      - name: wlp-output
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bridge
  labels:
    app: bridge
    service: bridge
spec:
  ports:
  - port: 9080
    name: http
  selector:
    app: bridge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: starfleet-bridge
  labels:
    account: bridge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge-v1
  labels:
    app: bridge
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bridge
      version: v1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9080'
        prometheus.io/path: /metrics
      labels:
        app: bridge
        version: v1
    spec:
      serviceAccountName: starfleet-bridge
      containers:
      - name: bridge
        image: registry.istio.io/release/examples-bookinfo-productpage-v1:1.20.3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9080
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        - name: DETAILS_HOSTNAME
          value: cargo
        - name: REVIEWS_HOSTNAME
          value: scout
        - name: RATINGS_HOSTNAME
          value: navcom
      volumes:
      - name: tmp
        emptyDir: {}
