metadata:
  name: "ats-014-capstone-060-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base, istiod and the istio-ingressgateway gateway) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "capstone-060-02-setup"
      description: "Creates the starfleet namespace with the Starfleet, the probe (v1 and v2), the shuttle client, mesh-wide access logs and a certificate and key for starfleet.example.com in /tmp, and no ingress configuration"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-https-edge-with-routing"
      description: "Confirms the TLS secret in istio-system, HTTPS with the provided certificate, the HTTP redirect, the route to bridge, header-based routing to probe v2 and v1 through a DestinationRule, and a 404 for every other path"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
