metadata:
  name: "ats-014-lab-060-04-01"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base, istiod and the istio-ingressgateway gateway) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-060-04-01-workloads"
      description: "Creates the starfleet namespace with the echo probe (v1 and v2), the shuttle client, mesh-wide access logs and a certificate and key for probe.example.com in /tmp"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-gateway-https"
      description: "Confirms the TLS secret in istio-system, HTTPS served with the provided certificate for probe.example.com, the gateway holding the secret as ACTIVE, and plain HTTP redirected with a 301"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
