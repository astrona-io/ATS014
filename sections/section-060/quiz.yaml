# Knowledge check for section 060. Listed in astrona.yaml as a `type: quiz` entry after the last capstone lab. Contract:
# schemas/question-bank.schema.json. Keep question ids stable once published.
schema_version: 1
kind: question_bank
id: ats014-060
course_id: ATS014
exam_code: ICA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-060
  title: "Configuring Ingress And Egress Traffic — Ingress"
questions:
  - id: ats014-060-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Say what a Gateway does and does not do."
    source_readings:
      - sections/section-060/module-01/course-01-open-a-listener-with-a-gateway.md
      - sections/section-060/module-01/course-02-bind-a-virtualservice-to-a-gateway.md
    prompt: |-
      A correct `Gateway` is applied, and no `VirtualService` is bound to it. What does a request through it get?
    options:
      - id: a
        text: "`404` with the response flag `NR`, because the gateway has a listener and no route."
        explanation: "Correct. A `Gateway` opens a listener and routes nothing by itself."
      - id: b
        text: "`000`, because there is no listener."
        explanation: "`000` points at the `Gateway` selector. The listener exists here."
      - id: c
        text: "`503` with `NC`, because the destination is missing."
        explanation: "`NC` needs a route that names a missing cluster."
      - id: d
        text: "`200`, because the `Gateway` routes by host name."
        explanation: "A `VirtualService` gives the gateway its routes."
    correct_option: a
    explanation: "A `VirtualService` must name the `Gateway` in its `gateways:` field."

  - id: ats014-060-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Read the status code at a gateway."
    source_readings:
      - sections/section-060/module-01/course-04-diagnose-000-404-and-503-at-the-ingress-gateway.md
    prompt: |-
      A request through the ingress gateway gets `000`, and the gateway has no listener on port 80. Which object do you check first?
    options:
      - id: a
        text: "The `hosts` list of the `VirtualService`."
        explanation: "Wrong hosts give `404`, not `000`."
      - id: b
        text: "The `selector` of the `Gateway`."
        explanation: "Correct. A selector that matches no gateway pod gives no listener. The label depends on the install."
      - id: c
        text: "The subsets of the `DestinationRule`."
        explanation: "Missing subsets give `503 NC`."
      - id: d
        text: "The `exportTo` of the `ServiceEntry`."
        explanation: "This has no link to the listener."
    correct_option: b
    explanation: "`000` points at the listener, `404 NR` at the route and `503` at the destination."

  - id: ats014-060-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Redirect HTTP to HTTPS."
    source_readings:
      - sections/section-060/module-04/course-02-redirect-http-to-https-and-serve-several-hosts.md
    prompt: |-
      Which setting on the port 80 server makes the gateway answer plain HTTP with a `301` to the HTTPS address?
    options:
      - id: a
        text: "`tls.mode: SIMPLE`"
        explanation: "`SIMPLE` terminates HTTPS on a server. It does not redirect."
      - id: b
        text: "`tls.mode: PASSTHROUGH`"
        explanation: "`PASSTHROUGH` forwards encrypted bytes."
      - id: c
        text: "`tls.httpsRedirect: true`"
        explanation: "Correct. The gateway answers before any route is read."
      - id: d
        text: "A `redirect` rule in the `VirtualService`."
        explanation: "`httpsRedirect` is answered by the gateway before any route is read."
    correct_option: c
    explanation: "A host that is not on the port 80 server gets no redirect."

  - id: ats014-060-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Put the TLS secret in the right place."
    source_readings:
      - sections/section-060/module-04/course-01-terminate-https-with-tls-mode-simple-and-credentialname.md
    prompt: |-
      A `Gateway` in `starfleet` uses `credentialName: starfleet-tls` with `mode: SIMPLE`. The gateway pods run in `istio-system`. Where must the secret be, and of what type?
    options:
      - id: a
        text: "In `starfleet`, next to the `Gateway`."
        explanation: "The gateway pod reads secrets from its own namespace."
      - id: b
        text: "Mounted into the gateway pod as a volume."
        explanation: "You do not mount it."
      - id: c
        text: "In `istio-system`, with the keys `tls.crt`, `tls.key` and `ca.crt`."
        explanation: "`ca.crt` is needed for `MUTUAL`, not for `SIMPLE`."
      - id: d
        text: "In `istio-system`, with the type `kubernetes.io/tls` and the keys `tls.crt` and `tls.key`."
        explanation: "Correct. The proxy that needs the key runs in `istio-system`, and `istiod` sends it over SDS."
    correct_option: d
    explanation: "Prove it with `istioctl proxy-config secret`, which shows `ACTIVE` for a loaded secret."

  - id: ats014-060-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain how the gateway chooses a certificate."
    source_readings:
      - sections/section-060/module-04/course-02-redirect-http-to-https-and-serve-several-hosts.md
    prompt: |-
      Two HTTPS servers on port 443 serve `starfleet.example.com` and `probe.example.com`. How does the gateway pick a certificate?
    options:
      - id: a
        text: "By the `Host` header of the request."
        explanation: "The header cannot be read before the handshake."
      - id: b
        text: "By the SNI name the client sends in the TLS handshake."
        explanation: "Correct. The `Host` header arrives later, inside the encrypted connection."
      - id: c
        text: "By the order of the servers in the `Gateway`."
        explanation: "The order is not used."
      - id: d
        text: "By the source address of the client."
        explanation: "The client address does not choose a certificate."
    correct_option: b
    explanation: "Test with `curl --resolve`, so the real name goes into the handshake."

  - id: ats014-060-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Build the secret for MUTUAL."
    source_readings:
      - sections/section-060/module-04/course-03-require-client-certificates-with-mutual-and-pass-encrypted-traffic-through-with-passthrough.md
    prompt: |-
      A server uses `tls.mode: MUTUAL`. What must the secret behind `credentialName` hold?
    options:
      - id: a
        text: "`tls.crt`, `tls.key` and `ca.crt`, so it is a generic secret."
        explanation: "Correct. `kubectl create secret tls` makes only the first two keys."
      - id: b
        text: "Only `tls.crt` and `tls.key`."
        explanation: "Without `ca.crt` the gateway cannot check clients."
      - id: c
        text: "Only `ca.crt`."
        explanation: "The gateway also needs its own certificate and key."
      - id: d
        text: "The client certificate and key."
        explanation: "Clients keep their own key."
    correct_option: a
    explanation: "A client with no certificate, or one from another CA, cannot connect."

  - id: ats014-060-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Route a PASSTHROUGH host."
    source_readings:
      - sections/section-060/module-04/course-03-require-client-certificates-with-mutual-and-pass-encrypted-traffic-through-with-passthrough.md
    prompt: |-
      A server uses `tls.mode: PASSTHROUGH`. What does the server use as `protocol`, and what section of the `VirtualService` routes it?
    options:
      - id: a
        text: "`protocol: HTTPS`, and an `http:` section."
        explanation: "The gateway does not speak HTTP on this server."
      - id: b
        text: "`protocol: TLS`, and an `http:` section."
        explanation: "`http:` rules need a decrypted request."
      - id: c
        text: "`protocol: HTTP`, and a `tcp:` section."
        explanation: "`protocol: HTTP` would not carry TLS."
      - id: d
        text: "`protocol: TLS`, and a `tls:` match on `sniHosts`."
        explanation: "Correct. The gateway cannot read paths or headers, so `http:` rules do not apply."
    correct_option: d
    explanation: "The backend terminates TLS, so no certificate for it exists in `istio-system`."

  - id: ats014-060-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Diagnose one host that fails while another works."
    source_readings:
      - sections/section-060/module-04/course-02-redirect-http-to-https-and-serve-several-hosts.md
    prompt: |-
      HTTPS works for `starfleet.example.com` and fails with `000` for `probe.example.com`. `kubectl` shows no error. The secret `probe-tls` was created in `starfleet`. What does the gateway show?
    options:
      - id: a
        text: "The secret `kubernetes://probe-tls` is `ACTIVE`, and the fault is in the `VirtualService`."
        explanation: "`ACTIVE` means the gateway holds the certificate."
      - id: b
        text: "No listener on port 443, so the first host fails too."
        explanation: "The first host works, so the listener exists."
      - id: c
        text: "The secret `kubernetes://probe-tls` has the status `WARMING`, and the `istiod` log names `istio-system/probe-tls`."
        explanation: "Correct. Istio looks for exactly that name in `istio-system`."
      - id: d
        text: "`IST0132` for the `Gateway` host."
        explanation: "That is about a host the `Gateway` does not serve."
    correct_option: c
    explanation: "The same symptom appears when the name differs from `credentialName`."

  - id: ats014-060-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Find a VirtualService that the gateway never receives."
    source_readings:
      - sections/section-060/module-01/course-02-bind-a-virtualservice-to-a-gateway.md
    prompt: |-
      A `VirtualService` has the right host and paths and no `gateways:` field. What happens, and does `istioctl analyze` report it?
    options:
      - id: a
        text: "The gateway uses it, because the host matches."
        explanation: "The gateway uses it only when `gateways:` names the `Gateway`."
      - id: b
        text: "Its routes go to the sidecars (`mesh`), the gateway answers `404 NR`, and the analyzer reports nothing."
        explanation: "Correct. A `VirtualService` for `mesh` is valid. Naming a gateway replaces `mesh`, so list both if both need the routes."
      - id: c
        text: "`istioctl analyze` reports `IST0101`."
        explanation: "`IST0101` is about a missing reference."
      - id: d
        text: "The gateway answers `000`."
        explanation: "The listener exists, so the code is `404`."
    correct_option: b
    explanation: "The names on the two objects must line up."

  - id: ats014-060-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Control which namespaces attach routes to a Gateway API gateway."
    source_readings:
      - sections/section-060/module-03/course-04-control-route-attachment-with-allowedroutes.md
      - sections/section-060/module-03/course-03-attach-an-httproute-and-read-its-status.md
    prompt: |-
      A Gateway API `Gateway` has no `allowedRoutes`. An `HTTPRoute` in another namespace names it in `parentRefs`. What is the status of the route?
    options:
      - id: a
        text: "`Accepted=False` with `NotAllowedByListeners`. The default is `Same`."
        explanation: "Correct. Use `All`, or `Selector` with a namespace label, to allow other namespaces."
      - id: b
        text: "`Accepted=True`, because `parentRefs` names the namespace."
        explanation: "The owner of the `Gateway` decides, and the default allows only its own namespace."
      - id: c
        text: "`ResolvedRefs=False BackendNotFound`."
        explanation: "That is about `backendRefs`."
      - id: d
        text: "An empty `status.parents`."
        explanation: "That means `parentRefs` has a wrong name or namespace."
    correct_option: a
    explanation: "`Selector` also includes the `Gateway`'s own namespace."
