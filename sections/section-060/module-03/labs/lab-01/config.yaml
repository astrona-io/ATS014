metadata:
  name: "ats-014-lab-060-03"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: kind
  kind:
    # Loaded into the node from the host cache: Istio and the workloads start
    # without a registry pull on every run.
    preloadImages:
      - "registry.istio.io/release/pilot:1.30.5"
      - "registry.istio.io/release/proxyv2:1.30.5"
      - "nginx:1.27-alpine"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5, a demo-profile control plane, and the Gateway API CRDs"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-060-03-setup"
      description: "Creates the gwapi-demo and gwapi-team namespaces with two backends, and no Gateway or HTTPRoute"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-gateway-api"
      description: "Confirms a Gateway creates its own proxy in its own namespace, that allowedRoutes permits a labelled namespace, that both HTTPRoutes report Accepted and ResolvedRefs, and that live traffic reaches both backends"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
