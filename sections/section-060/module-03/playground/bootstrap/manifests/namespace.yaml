# The two planets for this playground.
# The istio-injection=enabled label makes Istio put a sidecar proxy (the
# communications officer) into every pod created here.
#   starfleet  the bridge, cargo, scout v1-v3, navcom and the shuttle
#   outpost    the probe: a second planet, owned by a different crew, so a
#              route from here has to be allowed to dock at a starfleet Gateway
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
  labels:
    istio-injection: enabled
