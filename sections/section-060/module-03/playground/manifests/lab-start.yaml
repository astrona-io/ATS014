apiVersion: v1
kind: Namespace
metadata:
  name: gwapi-demo
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service-v1
  namespace: gwapi-demo
  labels:
    app: booking-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
      version: v1
  template:
    metadata:
      labels:
        app: booking-service
        version: v1
    spec:
      containers:
        - name: booking-service
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8084
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-conf
          configMap:
            name: booking-service-v1-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: gwapi-demo
  labels:
    app: booking-service
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8084
  selector:
    app: booking-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-v1
  namespace: gwapi-demo
  labels:
    app: notification-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
      version: v1
  template:
    metadata:
      labels:
        app: notification-service
        version: v1
    spec:
      containers:
        - name: notification-service
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8084
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-conf
          configMap:
            name: notification-service-v1-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: gwapi-demo
  labels:
    app: notification-service
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8084
  selector:
    app: notification-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-service-v1-nginx-conf
  namespace: gwapi-demo
data:
  default.conf: |
    server {
      listen 8084;
      location / {
        # rewrite ... break sends a fixed path upstream. A proxy_pass with a URI
        # substitutes the matched prefix instead, so POST /book would arrive as
        # POST /notifybook - which no policy or route is written for.
        rewrite ^ /notify break;
        proxy_pass http://notification-service:80;
        proxy_http_version 1.1;
        # No proxy_set_header Host here on purpose: nginx then sends the
        # upstream's own name as the authority. Keeping the caller's Host
        # would make the sidecar route the hop straight back to this service,
        # because Istio routes on the authority header.
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-v1-nginx-conf
  namespace: gwapi-demo
data:
  default.conf: |
    server {
      listen 8084;
      location / {
        default_type application/json;
        return 200 '["EMAIL"]';
      }
    }
