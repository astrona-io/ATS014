metadata:
  name: "ats-014-lab-030-02-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "ats-014-lab-030-02-02-workloads"
      description: "Creates the starfleet namespace with the shuttle client, the probe (2 v1 pods, 2 v2 pods) and mesh-wide access logs, and the outpost namespace with the drifter, a client with no sidecar proxy"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"
    - name: "ats-014-lab-030-02-02-start"
      description: "Applies the starting state: a STRICT PeerAuthentication on the probe, a VirtualService that routes to subsets v1 and v2, and a DestinationRule with tls DISABLE and a subset load balancer that replaces the host's consistentHash"
      type: "file"
      source: "bootstrap/03-seed-fault.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-repaired-rule"
      description: "Confirms no tls DISABLE is left, the host-level consistentHash on x-user stays and no subset replaces it, the shuttle's proxy holds mTLS and RING_HASH for both subset clusters, the PeerAuthentication stays STRICT, live requests return 200 and one x-user always reaches one pod in each subset, and the drifter is still refused"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
