# Case 1: sticky by caller IP. Every request from the shuttle lands on the
# same probe pod, no header or cookie needed.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: probe
  namespace: starfleet
spec:
  host: probe
  trafficPolicy:
    loadBalancer:
      consistentHash:
        useSourceIp: true
