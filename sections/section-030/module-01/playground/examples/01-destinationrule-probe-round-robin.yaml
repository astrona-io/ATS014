# Load balancing algorithm for probe: ROUND_ROBIN (each pod in turn).
# Istio's default is LEAST_REQUEST (pod with fewest active requests).
# Other simple options: RANDOM, PASSTHROUGH.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: probe
  namespace: starfleet
spec:
  host: probe
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
