# Sticky sessions: requests with the same "x-user" header go to the same pod.
# The sidecar hashes the header value and maps it to a pod (consistent hash).
# Same name as 01, so applying this replaces the ROUND_ROBIN rule.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: probe
  namespace: starfleet
spec:
  host: probe
  trafficPolicy:
    loadBalancer:
      consistentHash:
        # Hash on this request header. Requests without it are spread normally.
        # Alternatives: httpCookie, useSourceIp, httpQueryParameterName.
        httpHeaderName: x-user
