# Load Balancer Policy And Session Affinity (PLAYGROUND) — Playground environment
# A clean sandbox: a new kind cluster "astro-ats-014-playground-030-01" with
# Istio and the apps this module uses. It then stays running for free
# exploration. No task, no grading, no `astrona submit`.
#   astrona run -c .
#   astrona destroy ats-014-playground-030-01
metadata:
  name: "ats-014-playground-030-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Istio (istio-base + istiod) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Namespace starfleet, access logs, the shuttle, and the probe: v1 (3 pods) and v2 (1 pod)"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
