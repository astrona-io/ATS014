metadata:
  name: "ats-014-capstone-030-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "ats-014-capstone-030-02-workloads"
      description: "Creates the starfleet namespace with the shuttle client, the probe (3 v1 pods, 2 v2 pods) and mesh-wide access logs, and the outpost namespace with the drifter, a client with no sidecar proxy"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"
    - name: "ats-014-capstone-030-02-start"
      description: "Applies the starting state: a STRICT PeerAuthentication on the probe and a VirtualService that routes to subsets v1 and v2, with no DestinationRule yet"
      type: "file"
      source: "bootstrap/03-seed-start.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-section-030-capstone-02"
      description: "Confirms the probe DestinationRule combines tls ISTIO_MUTUAL and a consistentHash on x-session-id at host level with a ROUND_ROBIN override on subset v2, the shuttle's proxy holds mTLS for both subset clusters, one session reaches one v1 pod and spreads over both v2 pods with status 200, the PeerAuthentication stays STRICT, and the drifter is still refused"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
