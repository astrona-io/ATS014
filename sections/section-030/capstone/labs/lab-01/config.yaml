metadata:
  name: "ats-014-capstone-030"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "capstone-030-setup"
      description: "Creates the sessions namespace with a three-replica stable version, a two-replica canary version behind the same Service, and a tester client"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

validation:
  scripts:
    - name: "verify-section-030-capstone"
      description: "Confirms host-level consistent hashing pins a session to one stable endpoint, a subset-level LEAST_REQUEST override applies to canary only, all caller traffic stays on stable, and the canary receives mirrored copies while remaining invisible to callers"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
