training:
  id: ATS014
  title: "ICA: Traffic Management"
  description: >
    Training material covering the Istio Certified Associate (ICA) Traffic
    Management domain — request routing and configuration scoping, traffic
    shifting and mirroring, destination rule traffic policies, resilience
    features, fault injection, ingress across three APIs, external services
    and workloads, and egress gateways. Each module pairs a layered reader
    with an ungraded hands-on playground and a graded practice lab, and each
    section closes with an integration capstone.
    Built and verified against Istio 1.30.5.

  certification:
    name: Istio Certified Associate
    code: ICA
    provider: CNCF / Linux Foundation
    domain: Traffic Management

modules:

  - id: module-010
    title: "Section 010: Configuring Routing Within A Service Mesh"
    description: >
      Split a Service into named subsets and route individual requests by
      header, URI and query parameter, then cut a proxy's configuration down
      from the whole service registry to the hosts a workload actually calls.

