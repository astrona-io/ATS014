training:
  id: ATS014
  title: "ICA: Traffic Management"
  description: >
    Training material covering the Istio Certified Associate (ICA) Traffic
    Management domain — request routing and configuration scoping, traffic
    shifting and mirroring, destination rule traffic policies, resilience
    features, fault injection, ingress across three APIs, external services
    and workloads, egress gateways, and the safe order to apply and remove
    traffic rules. Each module pairs a layered reader with an ungraded
    hands-on playground (most run Bookinfo, the Istio docs' sample app) and,
    for almost every module, a graded practice lab. Each section closes with
    an integration capstone.
    Built and verified against Istio 1.30.5.

  certification:
    name: Istio Certified Associate
    code: ICA
    provider: CNCF / Linux Foundation
    domain: Traffic Management

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

  - id: module-000
    title: "Mesh Foundations"
    description: >
      Prerequisite material for the whole domain: what sidecar injection adds
      to a pod, how traffic is redirected into the proxy, how istiod programs
      every proxy over xDS, and the diagnostic commands that tell you what a
      proxy currently holds. No Istio traffic configuration is written here.

    content:
      - type: reading
